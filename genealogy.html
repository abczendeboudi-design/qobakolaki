<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شجره‌نامه</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f1e8;
      color: #24352a;
    }

    header {
      background: #315b42;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      padding: 9px 16px;
      border-radius: 10px;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .description {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid #ddd4c5;
    }

    .scan-box {
      background: white;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .scan-box a {
      display: block;
      cursor: zoom-in;
    }

    .scan-box img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      margin: auto;
      border-radius: 8px;
    }

    .digital-button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 24px;
      background: #315b42;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #e0aaaa;
      color: #8b3030;
      padding: 20px;
      border-radius: 12px;
      line-height: 2;
    }
  </style>
</head>

<body>

<header>
  <h1 id="pageTitle">شجره‌نامه</h1>
  <a class="back" href="index.html">بازگشت به صفحه اصلی</a>
</header>

<main>

  <div id="content"></div>

</main>

<script src="data/families.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const familyId = params.get("family");

  const content = document.getElementById("content");
  const pageTitle = document.getElementById("pageTitle");

  const families =
    window.GENEALOGY_DATA &&
    Array.isArray(window.GENEALOGY_DATA.families)
      ? window.GENEALOGY_DATA.families
      : [];

  const family = families.find(f => f.id === familyId);

  if (!family) {

    content.innerHTML = `
      <div class="error">
        شجره‌نامه مورد نظر پیدا نشد.
        <br>
        لطفاً از صفحه اصلی دوباره انتخاب کنید.
      </div>
    `;

  } else {

    pageTitle.textContent = family.name;

    content.innerHTML = `

      <div class="description">
        <strong>${family.name}</strong>
        <br>
        <span>
          تصویر اصلی شجره‌نامه از نسخه اسکن‌شده کتاب
        </span>
      </div>

      <div class="scan-box">

        <a href="${family.image}" target="_blank">
          <img
            src="${family.image}"
            alt="تصویر شجره‌نامه ${family.name}"
            onerror="showImageError()"
          >
        </a>

        <div>
          <a
            class="digital-button"
            href="family.html?family=${encodeURIComponent(family.id)}"
          >
            مشاهده شجره‌نامه دیجیتال
          </a>
        </div>

      </div>
    `;
  }

  function showImageError() {
    const box = document.querySelector(".scan-box");

    if (box) {
      box.innerHTML = `
        <div class="error">
          تصویر شجره‌نامه پیدا نشد.
          <br><br>
          لطفاً بررسی کن که فایل دقیقاً در این مسیر باشد:
          <br>
          <strong>
            images/genealogy/gholamhossein-qasem.png
          </strong>
        </div>
      `;
    }
  }
</script>

</body>
</html>
