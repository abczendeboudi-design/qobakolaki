<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>اطلاعات فرد</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background: #f4f7f5;

      color: #26352b;

    }


    header {

      background:
        linear-gradient(
          135deg,
          #285943,
          #4d8063
        );

      color: white;

      text-align: center;

      padding: 30px 15px;

    }


    header h1 {

      margin: 0 0 12px;

      font-size: 28px;

    }


    .back {

      display: inline-block;

      color: white;

      text-decoration: none;

      background:
        rgba(255,255,255,.16);

      padding: 9px 18px;

      border-radius: 9px;

    }


    .container {

      max-width: 900px;

      margin: 35px auto;

      padding: 0 18px;

    }


    .profile {

      background: white;

      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.08);

      border: 1px solid #dfe7e2;

    }


    .profile-header {

      text-align: center;

      padding-bottom: 25px;

      border-bottom: 1px solid #e4ebe6;

    }


    .avatar {

      width: 85px;

      height: 85px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: 0 auto 15px;

      border-radius: 50%;

      background: #eaf2ed;

      font-size: 42px;

    }


    .profile-header h1 {

      color: #285943;

      margin: 8px 0;

      font-size: 27px;

    }


    .family-name {

      color: #78847d;

      font-size: 14px;

    }


    .details {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 15px;

      margin-top: 25px;

    }


    .detail {

      background: #f7faf8;

      border: 1px solid #e2e9e4;

      border-radius: 12px;

      padding: 16px;

    }


    .label {

      display: block;

      color: #78847d;

      font-size: 12px;

      margin-bottom: 7px;

    }


    .value {

      color: #285943;

      font-weight: bold;

    }


    .section {

      margin-top: 28px;

    }


    .section h2 {

      color: #285943;

      font-size: 19px;

      border-right: 4px solid #357454;

      padding-right: 10px;

    }


    .links {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

    }


    .person-link {

      display: inline-block;

      background: #eaf2ed;

      color: #285943;

      text-decoration: none;

      padding: 10px 15px;

      border-radius: 9px;

      transition: .2s;

    }


    .person-link:hover {

      background: #dcebe1;

    }


    .empty {

      color: #78847d;

      background: #f7faf8;

      padding: 14px;

      border-radius: 10px;

    }


    .error {

      text-align: center;

      background: white;

      border-radius: 15px;

      padding: 30px;

      color: #a33;

    }


    footer {

      text-align: center;

      padding: 30px 15px;

      color: #78847d;

      font-size: 13px;

    }


    @media (max-width: 600px) {

      .profile {
        padding: 20px;
      }

      header h1 {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>
    👤 اطلاعات فرد
  </h1>


  <a
    href="./index.html"
    class="back"
  >
    ← صفحه اصلی
  </a>

</header>


<main class="container">

  <div id="content"></div>

</main>


<footer>
  شجره‌نامه قباکلکی © ۱۴۰۵
</footer>


<!-- اطلاعات افراد -->
<script src="./people.js"></script>


<script>

  const params =
    new URLSearchParams(
      window.location.search
    );


  const personId =
    params.get("id");


  const person =
    people[personId];


  const content =
    document.getElementById(
      "content"
    );


  /*
  اگر فرد پیدا نشد
  */

  if (!person) {

    content.innerHTML = `

      <div class="error">

        <h2>
          فرد موردنظر پیدا نشد
        </h2>

        <p>
          ممکن است لینک اشتباه باشد.
        </p>

        <a href="./index.html">
          بازگشت به صفحه اصلی
        </a>

      </div>

    `;

  } else {

    renderPerson();

  }


  /*
  تبدیل ID به لینک
  */

  function personLink(id) {

    if (!id || !people[id]) {
      return "";
    }


    return `

      <a
        class="person-link"
        href="./person.html?id=${encodeURIComponent(id)}"
      >
        ${people[id].name}
      </a>

    `;

  }


  /*
  نمایش یک مقدار
  */

  function showValue(
    value,
    emptyText = "ثبت نشده"
  ) {

    if (
      value &&
      value.trim &&
      value.trim() !== ""
    ) {

      return value;

    }

    return emptyText;

  }


  /*
  ساخت صفحه شخص
  */

  function renderPerson() {

    document.title =
      person.name +
      " | شجره‌نامه قباکلکی";


    let spouseLinks = "";

    if (
      Array.isArray(person.spouse) &&
      person.spouse.length > 0
    ) {

      spouseLinks =
        person.spouse
          .map(personLink)
          .join("");

    }


    let childrenLinks = "";

    if (
      Array.isArray(person.children) &&
      person.children.length > 0
    ) {

      childrenLinks =
        person.children
          .map(personLink)
          .join("");

    }


    let fatherLink = "";

    if (
      person.father &&
      people[person.father]
    ) {

      fatherLink =
        personLink(
          person.father
        );

    }


    let motherLink = "";

    if (
      person.mother &&
      people[person.mother]
    ) {

      motherLink =
        personLink(
          person.mother
        );

    }


    content.innerHTML = `

      <div class="profile">


        <!-- مشخصات اصلی -->

        <div class="profile-header">

          <div class="avatar">

            ${
              person.gender === "زن"
                ? "👩"
                : "👨"
            }

          </div>


          <h1>
            ${person.name}
          </h1>


          <div class="family-name">

            ${showValue(
              person.family,
              "خاندان ثبت نشده"
            )}

          </div>

        </div>


        <!-- اطلاعات شغلی و تحصیلی -->

        <div class="details">


          <div class="detail">

            <span class="label">
              جنسیت
            </span>

            <span class="value">
              ${showValue(
                person.gender
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              شغل
            </span>

            <span class="value">
              ${showValue(
                person.job
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              تحصیلات
            </span>

            <span class="value">
              ${showValue(
                person.education
              )}
            </span>

          </div>


        </div>


        <!-- پدر و مادر -->

        <div class="section">

          <h2>
            👨‍👩‍👧 والدین
          </h2>


          <div class="links">

            ${
              fatherLink ||
              motherLink

              ?

              `
                ${fatherLink}
                ${motherLink}
              `

              :

              `
                <div class="empty">
                  اطلاعات والدین ثبت نشده است.
                </div>
              `
            }

          </div>

        </div>


        <!-- همسر -->

        <div class="section">

          <h2>
            ❤️ همسر
          </h2>


          <div class="links">

            ${
              spouseLinks

              ?

              spouseLinks

              :

              `
                <div class="empty">
                  همسر ثبت نشده است.
                </div>
              `
            }

          </div>

        </div>


        <!-- فرزندان -->

        <div class="section">

          <h2>
            👶 فرزندان
          </h2>


          <div class="links">

            ${
              childrenLinks

              ?

              childrenLinks

              :

              `
                <div class="empty">
                  فرزندی ثبت نشده است.
                </div>
              `
            }

          </div>

        </div>


      </div>

    `;

  }

</script>

</body>
</html>
