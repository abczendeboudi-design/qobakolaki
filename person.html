<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مشخصات فرد</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7f4;
            color: #333;
        }

        header {
            background: #245c3a;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            font-size: 15px;
        }

        .container {
            max-width: 750px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #e5eee7;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: #e7f2ea;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
        }

        .profile-header h1 {
            color: #245c3a;
            margin: 15px 0 5px;
        }

        .gender {
            color: #777;
            font-size: 14px;
        }

        .section {
            margin-top: 25px;
        }

        .section h2 {
            color: #245c3a;
            font-size: 19px;

            border-bottom: 1px solid #e1e1e1;
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            padding: 14px 5px;

            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #245c3a;
            text-align: left;
        }

        .family-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .family-person {
            display: inline-block;
            padding: 9px 14px;

            background: #e7f2ea;
            color: #245c3a;

            border-radius: 10px;

            text-decoration: none;
        }

        .family-person:hover {
            background: #d4e8da;
        }

        .empty {
            color: #999;
        }

        .bio {
            line-height: 2;
            color: #555;
        }

        .back-button {
            display: block;
            text-align: center;

            margin-top: 30px;
            padding: 14px;

            background: #245c3a;
            color: white;

            border-radius: 12px;

            text-decoration: none;
        }

        .back-button:hover {
            background: #17452b;
        }

        .error {
            text-align: center;
            color: #a33;
            padding: 40px;
        }

        @media (max-width: 600px) {

            .profile-card {
                padding: 20px;
            }

            .info-row {
                flex-direction: column;
                gap: 5px;
            }

            .value {
                text-align: right;
            }

            header h1 {
                font-size: 23px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>🌳 شجره‌نامه قباکلکی</h1>

    <p>
        اطلاعات و تاریخچه افراد خانواده
    </p>

</header>


<div class="container">

    <div id="profile"></div>

</div>


<script src="people.js"></script>


<script>

    // دریافت شناسه فرد از آدرس صفحه
    const params = new URLSearchParams(window.location.search);

    const id = params.get("id");

    const person = people[id];

    const profile = document.getElementById("profile");


    // اگر فرد پیدا نشد
    if (!person) {

        profile.innerHTML = `
            <div class="profile-card error">

                <h2>فرد مورد نظر پیدا نشد</h2>

                <p>
                    ممکن است لینک اشتباه باشد.
                </p>

                <a class="back-button"
                   href="index.html">
                    ← بازگشت به شجره‌نامه
                </a>

            </div>
        `;

    }

    else {

        document.title =
            "مشخصات " + person.name;


        // پیدا کردن شناسه افراد بر اساس نام
        function findPersonId(name) {

            for (const key in people) {

                if (people[key].name === name) {
                    return key;
                }

            }

            return null;
        }


        // ساخت لینک برای اعضای خانواده
        function familyLinks(names) {

            if (!names || names.length === 0) {

                return '<span class="empty">ثبت نشده</span>';

            }


            return names.map(function(name) {

                const personId = findPersonId(name);

                if (personId) {

                    return `
                        <a class="family-person"
                           href="person.html?id=${personId}">
                            ${name}
                        </a>
                    `;

                }

                return `
                    <span class="family-person">
                        ${name}
                    </span>
                `;

            }).join("");

        }


        // آیکون بر اساس جنسیت
        let avatar = "👤";

        if (person.gender === "مرد") {
            avatar = "👨";
        }

        if (person.gender === "زن") {
            avatar = "👩";
        }

        if (person.gender === "دختر") {
            avatar = "👧";
        }


        profile.innerHTML = `

            <div class="profile-card">


                <!-- نام فرد -->

                <div class="profile-header">

                    <div class="avatar">
                        ${avatar}
                    </div>

                    <h1>
                        ${person.name}
                    </h1>

                    <div class="gender">
                        ${person.gender || ""}
                    </div>

                </div>


                <!-- اطلاعات شخصی -->

                <div class="section">

                    <h2>👤 اطلاعات فرد</h2>


                    <div class="info-row">

                        <span class="label">
                            شغل
                        </span>

                        <span class="value">
                            ${person.job || "ثبت نشده"}
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">
                            تحصیلات
                        </span>

                        <span class="value">
                            ${person.education || "ثبت نشده"}
                        </span>

                    </div>

                </div>


                <!-- والدین -->

                <div class="section">

                    <h2>👨‍👩‍👧 والدین</h2>

                    <div class="family-list">

                        ${
                            person.father
                            ? `<span class="family-person">
                                👨 ${person.father}
                               </span>`
                            : ""
                        }

                        ${
                            person.mother
                            ? `<span class="family-person">
                                👩 ${person.mother}
                               </span>`
                            : ""
                        }

                        ${
                            !person.father && !person.mother
                            ? '<span class="empty">اطلاعات ثبت نشده</span>'
                            : ""
                        }

                    </div>

                </div>


                <!-- همسر -->

                <div class="section">

                    <h2>💍 همسر</h2>

                    <div class="family-list">

                        ${familyLinks(person.spouse)}

                    </div>

                </div>


                <!-- فرزندان -->

                <div class="section">

                    <h2>👶 فرزندان</h2>

                    <div class="family-list">

                        ${familyLinks(person.children)}

                    </div>

                </div>


                <!-- زندگی نامه -->

                <div class="section">

                    <h2>📖 درباره این فرد</h2>

                    <p class="bio">

                        ${
                            person.bio ||
                            "هنوز اطلاعاتی درباره زندگی و سوابق این فرد ثبت نشده است."
                        }

                    </p>

                </div>


                <!-- بازگشت -->

                <a class="back-button"
                   href="index.html">

                    ← بازگشت به شجره‌نامه

                </a>


            </div>

        `;

    }

</script>


</body>

</html>
