<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>شجره‌نامه قباکلکی</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background: #f4f7f5;

      color: #26352b;

    }


    header {

      background:
        linear-gradient(
          135deg,
          #285943,
          #4d8063
        );

      color: white;

      text-align: center;

      padding: 27px 15px;

    }


    header h1 {

      margin: 0 0 12px;

      font-size: 28px;

    }


    .back {

      display: inline-block;

      color: white;

      text-decoration: none;

      background:
        rgba(255,255,255,.16);

      padding: 9px 18px;

      border-radius: 9px;

    }


    .container {

      max-width: 1400px;

      margin: 30px auto;

      padding: 0 15px;

      overflow-x: auto;

    }


    .tree {

      min-width: 850px;

      text-align: center;

      padding: 10px;

    }


    .generation {

      margin-bottom: 35px;

    }


    .generation-title {

      color: #69766e;

      font-size: 14px;

      margin-bottom: 12px;

    }


    .person-card {

      display: inline-flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-width: 155px;

      min-height: 75px;

      padding: 12px 18px;

      margin: 5px;

      background: white;

      border: 1px solid #d9e3dc;

      border-radius: 14px;

      box-shadow:
        0 4px 12px rgba(0,0,0,.07);

      transition: .2s;

    }


    .person-card:hover {

      transform: translateY(-3px);

      box-shadow:
        0 8px 18px rgba(0,0,0,.12);

    }


    .person-name {

      color: #24583f;

      text-decoration: none;

      font-size: 17px;

      font-weight: bold;

    }


    .person-name:hover {

      text-decoration: underline;

    }


    .job {

      margin-top: 6px;

      font-size: 12px;

      color: #78837c;

    }


    .couple {

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: 5px;

    }


    .heart {

      color: #b75b65;

      font-size: 20px;

      margin: 0 3px;

    }


    .line {

      width: 2px;

      height: 30px;

      background: #aab9af;

      margin: 5px auto;

    }


    .children {

      display: flex;

      justify-content: center;

      align-items: flex-start;

      flex-wrap: wrap;

      gap: 20px;

      margin-top: 10px;

      padding-top: 20px;

      position: relative;

    }


    .children::before {

      content: "";

      position: absolute;

      top: 0;

      left: 8%;

      right: 8%;

      height: 2px;

      background: #aab9af;

    }


    .child {

      position: relative;

      padding-top: 20px;

      min-width: 180px;

    }


    .child::before {

      content: "";

      position: absolute;

      top: 0;

      right: 50%;

      width: 2px;

      height: 20px;

      background: #aab9af;

      transform: translateX(50%);

    }


    .grandchildren {

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;

    }


    .grandchildren .person-card {

      min-width: 135px;

      min-height: 65px;

    }


    .message {

      max-width: 600px;

      margin: 40px auto;

      padding: 25px;

      background: white;

      border-radius: 14px;

      text-align: center;

      line-height: 2;

      box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    }


    .error {

      color: #a33;

    }


    .info {

      max-width: 800px;

      margin: 35px auto;

      background: #eaf2ed;

      border-right: 5px solid #357454;

      padding: 18px;

      border-radius: 12px;

      text-align: center;

      line-height: 2;

    }


    footer {

      text-align: center;

      color: #78847d;

      padding: 25px;

      font-size: 13px;

    }


    @media (max-width: 700px) {

      .tree {
        min-width: 750px;
      }

      header h1 {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1 id="title">
    🌳 شجره‌نامه
  </h1>


  <a
    href="./index.html"
    class="back"
  >
    ← بازگشت به صفحه اصلی
  </a>

</header>


<main class="container">

  <div
    id="tree"
    class="tree"
  ></div>


  <div class="info">

    👤 برای مشاهده اطلاعات هر فرد،
    روی نام او کلیک کنید.

    <br>

    شغل و تحصیلات فرد در صفحه اختصاصی او نمایش داده می‌شود.

  </div>

</main>


<footer>
  شجره‌نامه قباکلکی © ۱۴۰۵
</footer>


<!-- ابتدا اطلاعات افراد بارگذاری می‌شود -->
<script src="./people.js"></script>


<script>

  const params =
    new URLSearchParams(
      window.location.search
    );


  const familyId =
    params.get("family");


  const familyDefinitions = {

    ahmad: {

      title: "خاندان احمد",

      parent: "gholamhossein",

      main: "ahmad"

    },


    ali: {

      title: "خاندان علی",

      parent: "gholamhossein",

      main: "ali"

    },


    "mohammad-abdolrashid": {

      title:
        "خاندان محمد عبدالرشید",

      parent: null,

      main:
        "mohammad-abdolrashid"

    }

  };


  const family =
    familyDefinitions[familyId];


  if (!family) {

    document.getElementById(
      "title"
    ).textContent =
      "خاندان پیدا نشد";


    document.getElementById(
      "tree"
    ).innerHTML = `

      <div class="message error">

        <h3>
          خاندان موردنظر پیدا نشد.
        </h3>

        <p>
          لطفاً از صفحه اصلی
          یک خاندان را انتخاب کنید.
        </p>

        <a href="./index.html">
          بازگشت به صفحه اصلی
        </a>

      </div>

    `;

  } else {

    document.title =
      family.title +
      " | شجره‌نامه قباکلکی";


    document.getElementById(
      "title"
    ).textContent =
      "🌳 " + family.title;


    renderFamily();

  }


  function getPerson(id) {

    if (
      typeof people === "undefined"
    ) {
      return null;
    }

    return people[id] || null;

  }


  function personCard(id) {

    const person =
      getPerson(id);


    if (!person) {

      return `
        <div class="person-card">
          <span class="person-name">
            فرد ثبت نشده
          </span>
        </div>
      `;

    }


    const job =
      person.job &&
      person.job.trim()
        ? person.job
        : "اطلاعات بیشتر";


    return `

      <div class="person-card">

        <a
          class="person-name"
          href="./person.html?id=${encodeURIComponent(id)}"
        >
          ${person.name}
        </a>

        <div class="job">
          ${job}
        </div>

      </div>

    `;

  }


  function spouseOf(id) {

    const person =
      getPerson(id);


    if (
      !person ||
      !person.spouse
    ) {
      return null;
    }


    if (
      Array.isArray(person.spouse)
    ) {

      return person.spouse.length
        ? person.spouse[0]
        : null;

    }


    return person.spouse;

  }


  function couple(id) {

    const person =
      getPerson(id);


    if (!person) {
      return "";
    }


    const spouseId =
      spouseOf(id);


    let html = `

      <div class="couple">

        ${personCard(id)}

    `;


    if (
      spouseId &&
      getPerson(spouseId)
    ) {

      html += `

        <span class="heart">
          ♥
        </span>

        ${personCard(spouseId)}

      `;

    }


    html += `
      </div>
    `;


    return html;

  }


  function renderChildren(
    parentId
  ) {

    const parent =
      getPerson(parentId);


    if (
      !parent ||
      !Array.isArray(parent.children) ||
      parent.children.length === 0
    ) {

      return "";

    }


    let html = `
      <div class="children">
    `;


    parent.children.forEach(
      childId => {

        const child =
          getPerson(childId);


        if (!child) {
          return;
        }


        html += `

          <div class="child">

            ${couple(childId)}

        `;


        if (
          Array.isArray(
            child.children
          ) &&
          child.children.length > 0
        ) {

          html += `

            <div class="line"></div>

            <div class="grandchildren">

          `;


          child.children.forEach(
            grandChildId => {

              html +=
                personCard(
                  grandChildId
                );

            }
          );


          html += `

            </div>

          `;

        }


        html += `

          </div>

        `;

      }
    );


    html += `
      </div>
    `;


    return html;

  }


  function renderFamily() {

    const mainPerson =
      getPerson(family.main);


    if (!mainPerson) {

      document.getElementById(
        "tree"
      ).innerHTML = `

        <div class="message error">

          اطلاعات این خاندان
          در people.js پیدا نشد.

        </div>

      `;

      return;

    }


    let html = "";


    /*
    نسل بالاتر
    */

    if (family.parent) {

      const parent =
        getPerson(
          family.parent
        );


      if (parent) {

        html += `

          <div class="generation">

            <div class="generation-title">
              نسل بالاتر
            </div>

            ${personCard(
              family.parent
            )}

            <div class="line"></div>

          </div>

        `;

      }

    }


    /*
    نسل اصلی و فرزندان
    */

    html += `

      <div class="generation">

        <div class="generation-title">
          نسل اصلی
        </div>

        ${couple(
          family.main
        )}

        ${renderChildren(
          family.main
        )}

      </div>

    `;


    document.getElementById(
      "tree"
    ).innerHTML = html;

  }

</script>

</body>
</html>
