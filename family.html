<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شجره‌نامه دیجیتال</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f1e8;
      color: #24352a;
    }

    header {
      background: #315b42;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    .controls {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls a,
    .controls button {
      border: 0;
      background: #315b42;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
    }

    .stats {
      max-width: 1200px;
      margin: 0 auto 20px;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: white;
      border: 1px solid #ddd4c5;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
    }

    .stat-number {
      display: block;
      font-size: 25px;
      font-weight: bold;
      color: #315b42;
      margin-bottom: 5px;
    }

    .tree-wrapper {
      max-width: 1400px;
      margin: auto;
      padding: 10px 15px 50px;
      overflow-x: auto;
    }

    .tree {
      min-width: max-content;
      padding: 20px;
    }

    .person-card {
      display: inline-block;
      min-width: 170px;
      max-width: 230px;
      background: white;
      border: 2px solid #b9c8bc;
      border-radius: 14px;
      padding: 13px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.06);
      margin: 5px;
    }

    .person-card.root {
      border-color: #315b42;
      background: #eef5ef;
      border-width: 3px;
    }

    .person-name {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .person-role {
      font-size: 12px;
      color: #777;
    }

    .person-card button {
      border: 0;
      background: none;
      font-family: inherit;
      cursor: pointer;
      color: inherit;
    }

    .union {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 10px 30px;
      position: relative;
    }

    .spouse-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .marriage {
      font-size: 22px;
      color: #9a7650;
    }

    .children {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 18px;
      margin-top: 30px;
      padding-top: 25px;
      flex-wrap: wrap;
    }

    .children::before {
      content: "";
      position: absolute;
      top: 0;
      right: 10%;
      left: 10%;
      border-top: 2px solid #b9c8bc;
    }

    .child {
      position: relative;
      min-width: 180px;
      text-align: center;
      padding-top: 8px;
    }

    .child::before {
      content: "";
      position: absolute;
      top: -25px;
      right: 50%;
      height: 25px;
      border-right: 2px solid #b9c8bc;
    }

    .child-generation {
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
    }

    .more-link {
      display: inline-block;
      margin-top: 6px;
      color: #315b42;
      font-size: 12px;
      text-decoration: none;
    }

    .section-title {
      text-align: center;
      font-size: 18px;
      margin: 15px 0;
      color: #315b42;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin: 30px;
    }

    /* Profile */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .profile {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      left: 15px;
      top: 12px;
      border: 0;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .profile h2 {
      margin-top: 5px;
      color: #315b42;
    }

    .profile-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.8;
    }

    .profile-row strong {
      color: #315b42;
    }

    .profile ul {
      margin: 5px 0;
    }

    .profile-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .profile-actions a,
    .profile-actions button {
      border: 0;
      background: #315b42;
      color: white;
      padding: 10px 15px;
      border-radius: 9px;
      text-decoration: none;
      font-family: inherit;
      cursor: pointer;
    }

    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .person-card {
        min-width: 150px;
      }

      .children {
        justify-content: flex-start;
      }
    }

    @media print {

      header {
        background: white;
        color: black;
        padding: 10px;
      }

      .controls,
      .stats,
      .modal,
      .more-link {
        display: none !important;
      }

      body {
        background: white;
      }

      .tree-wrapper {
        overflow: visible;
        max-width: none;
      }

      .tree {
        padding: 0;
      }

      .person-card {
        box-shadow: none;
      }
    }
  </style>
</head>

<header>

<div class="controls">
  <a id="backToScan" href="#">مشاهده تصویر اصلی</a>

  </div>

</div>

<div id="treeContainer" class="tree-wrapper"></div>

<div id="profileModal" class="modal">

/* =========================================
   تنظیمات
========================================= */

const params = new URLSearchParams(window.location.search);

const familyId = params.get("family");

const selectedPerson = params.get("person");


/* =========================================
   پیدا کردن خاندان
========================================= */

const families =
  window.GENEALOGY_DATA &&
  Array.isArray(window.GENEALOGY_DATA.families)
    ? window.GENEALOGY_DATA.families
    : [];

const family = families.find(f => f.id === familyId);


/* =========================================
   ریشه
========================================= */

let ROOT_ID =
  selectedPerson ||
  (family ? family.root : null);


/* =========================================
   عناصر صفحه
========================================= */

const familyTitle =
  document.getElementById("familyTitle");

const treeContainer =
  document.getElementById("treeContainer");

const memberCount =
  document.getElementById("memberCount");

const infoCount =
  document.getElementById("infoCount");

const backToScan =
  document.getElementById("backToScan");


/* =========================================
   بررسی
========================================= */

if (!family || !ROOT_ID || !PEOPLE[ROOT_ID]) {

  familyTitle.textContent = "شجره‌نامه پیدا نشد";

  treeContainer.innerHTML = `
    <div class="empty">
      اطلاعات این شجره‌نامه پیدا نشد.
      <br><br>
      لطفاً از صفحه اصلی دوباره وارد شوید.
    </div>
  `;

} else {

  familyTitle.textContent =
    selectedPerson
      ? "خانواده " + PEOPLE[ROOT_ID].name
      : family.name;

  backToScan.href =
    "genealogy.html?family=" +
    encodeURIComponent(family.id);

  renderTree();

  updateStats();
}


/* =========================================
   ساخت کارت شخص
========================================= */

function personCard(id, generation, isRoot = false) {

  const person = PEOPLE[id];

  if (!person) {
    return "";
  }

  const hasFamily =
    Array.isArray(person.spouses) &&
    person.spouses.length > 0;

  return `
    <div class="person-card ${isRoot ? "root" : ""}">

      <button onclick="openProfile('${id}')">

        <div class="person-name">
          ${person.name}
        </div>

        <div class="person-role">
          ${person.shared ? "فرد مشترک" : "عضو خانواده"}
        </div>

      </button>

      ${
        generation >= 3
          ? `
            <div>
              <a
                class="more-link"
                href="family.html?family=${encodeURIComponent(family.id)}&person=${encodeURIComponent(id)}"
              >
                ${
                  hasFamily
                    ? "مشاهده خانواده"
                    : "مشاهده مشخصات"
                }
              </a>
            </div>
          `
          : ""
      }

    </div>
  `;
}


/* =========================================
   ساخت شاخه
========================================= */

function createUnion(personId, generation, visited = new Set()) {

  const person = PEOPLE[personId];

  if (!person) {
    return "";
  }

  if (visited.has(personId)) {
    return personCard(personId, generation);
  }

  const nextVisited = new Set(visited);

  nextVisited.add(personId);

  const spouses =
    Array.isArray(person.spouses) &&
    person.spouses.length
      ? person.spouses
      : [
          {
            id: null,
            children: []
          }
        ];

  let html = "";

  spouses.forEach(spouse => {

    html += `
      <div class="union">

        <div class="spouse-row">

          ${personCard(
            personId,
            generation,
            generation === 1
          )}

          ${
            spouse.id
              ? `
                <div class="marriage">♥</div>
                ${personCard(
                  spouse.id,
                  generation,
                  false
                )}
              `
              : ""
          }

        </div>
    `;

    const children =
      Array.isArray(spouse.children)
        ? spouse.children
        : [];

    if (
      children.length > 0 &&
      generation < 3
    ) {

      html += `
        <div class="children">
      `;

      children.forEach(childId => {

        html += `
          <div class="child">

            <div class="child-generation">
              نسل ${generation + 1}
            </div>

            ${createUnion(
              childId,
              generation + 1,
              nextVisited
            )}

          </div>
        `;

      });

      html += `
        </div>
      `;
    }

    html += `
      </div>
    `;

  });

  return html;
}


/* =========================================
   نمایش درخت
========================================= */

function renderTree() {

  treeContainer.innerHTML = `
    <div class="tree">

      <div class="section-title">
        شجره‌نامه دیجیتال
      </div>

      ${createUnion(ROOT_ID, 1)}

    </div>
  `;
}


/* =========================================
   شمارش افراد
========================================= */

function collectFamilyPeople(rootId) {

  const visited = new Set();

  function walk(id) {

    if (!id || visited.has(id)) {
      return;
    }

    const person = PEOPLE[id];

    if (!person) {
      return;
    }

    visited.add(id);

    if (Array.isArray(person.spouses)) {

      person.spouses.forEach(spouse => {

        if (spouse.id) {
          walk(spouse.id);
        }

        if (Array.isArray(spouse.children)) {

          spouse.children.forEach(child => {
            walk(child);
          });

        }

      });

    }

  }

  walk(rootId);

  return visited;
}


function updateStats() {

  const people =
    collectFamilyPeople(ROOT_ID);

  memberCount.textContent =
    people.size;

  let info = 0;

  people.forEach(id => {

    const p = PEOPLE[id];

    if (
      p &&
      (
        p.name ||
        p.spouses
      )
    ) {
      info++;
    }

  });

  infoCount.textContent = info;
}


/* =========================================
   پروفایل
========================================= */

function openProfile(id) {

  const person = PEOPLE[id];

  if (!person) {
    return;
  }

  const parents =
    findParents(id);

  const spouses =
    Array.isArray(person.spouses)
      ? person.spouses
      : [];

  let children = [];

  spouses.forEach(spouse => {

    if (Array.isArray(spouse.children)) {

      spouse.children.forEach(child => {

        if (!children.includes(child)) {
          children.push(child);
        }

      });

    }

  });


  let html = `

    <h2>${person.name}</h2>

    <div class="profile-row">
      <strong>نام:</strong>
      ${person.name}
    </div>

    <div class="profile-row">
      <strong>شغل:</strong>
      ثبت نشده
    </div>

    <div class="profile-row">
      <strong>تحصیلات:</strong>
      ثبت نشده
    </div>

    <div class="profile-row">
      <strong>پدر / مادر:</strong>
      ${
        parents.length
          ? parents
              .map(p => PEOPLE[p]?.name)
              .filter(Boolean)
              .join("، ")
          : "ثبت نشده"
      }
    </div>

  `;


  if (spouses.length) {

    html += `
      <div class="profile-row">
        <strong>همسر:</strong>
        <ul>
    `;

    spouses.forEach(s => {

      if (s.id && PEOPLE[s.id]) {

        html += `
          <li>
            ${PEOPLE[s.id].name}
          </li>
        `;

      }

    });

    html += `
        </ul>
      </div>
    `;

  }


  html += `
    <div class="profile-row">
      <strong>فرزندان:</strong>
      ${
        children.length
          ? `
            <ul>
              ${children
                .map(c =>
                  PEOPLE[c]
                    ? `<li>${PEOPLE[c].name}</li>`
                    : ""
                )
                .join("")
              }
            </ul>
          `
          : "ثبت نشده"
      }
    </div>
  `;


  html += `

    <div class="profile-row">
      <strong>عکس:</strong>
      ثبت نشده
    </div>

    <div class="profile-actions">

      ${
        spouses.length
          ? `
            <a
              href="family.html?family=${encodeURIComponent(family.id)}&person=${encodeURIComponent(id)}"
            >
              مشاهده خانواده
            </a>
          `
          : ""
      }

      <button onclick="window.print()">
        چاپ
      </button>

    </div>

  `;


  document.getElementById("profileContent").innerHTML =
    html;

  document.getElementById("profileModal")
    .classList.add("show");
}


function closeProfile() {

  document.getElementById("profileModal")
    .classList.remove("show");

}


document.getElementById("profileModal")
  .addEventListener("click", function(e) {

    if (e.target === this) {
      closeProfile();
    }

  });


/* =========================================
   پیدا کردن والدین
========================================= */

function findParents(childId) {

  const parents = [];

  Object.keys(PEOPLE).forEach(parentId => {

    const parent = PEOPLE[parentId];

    if (!Array.isArray(parent.spouses)) {
      return;
    }

    parent.spouses.forEach(spouse => {

      if (
        Array.isArray(spouse.children) &&
        spouse.children.includes(childId)
      ) {

        if (!parents.includes(parentId)) {
          parents.push(parentId);
        }

        if (
          spouse.id &&
          !parents.includes(spouse.id)
        ) {
          parents.push(spouse.id);
        }

      }

    });

  });

  return parents;
}
