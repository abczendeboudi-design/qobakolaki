<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شجره‌نامه قباکلکی</title>

    <script src="./people.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f7faf8;
            color: #26352f;
        }

        /* هدر */
        header {
            background:
                linear-gradient(
                    rgba(0, 85, 45, 0.70),
                    rgba(0, 65, 35, 0.78)
                ),
                url("./qabaklaki.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
            min-height: 230px;
            padding: 55px 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        header p {
            margin: 15px 0 0;
            font-size: 19px;
        }

        /* منو */
        nav {
            background: #00633d;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 16px 25px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 4px solid transparent;
        }

        nav a:hover,
        nav a.active {
            background: rgba(255,255,255,0.08);
            border-bottom-color: #b7f0d5;
        }

        /* محتوای اصلی */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 45px 20px 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h2 {
            color: #075b3b;
            font-size: 34px;
            margin: 0 0 12px;
        }

        .page-title p {
            color: #52635c;
            font-size: 18px;
            margin: 0;
        }

        /* کارت خانواده */
        .family-card {
            background: white;
            border: 1px solid #d7e8df;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 80, 50, 0.07);
        }

        .family-header {
            background: linear-gradient(
                90deg,
                #e2f2eb,
                #f0f8f4
            );

            padding: 17px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .family-name {
            display: flex;
            align-items: center;
            gap: 12px;

            color: #075b3b;
            font-size: 24px;
            font-weight: bold;
        }

        .person-icon {
            width: 38px;
            height: 38px;

            border-radius: 50%;
            background: #08734a;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .father-label {
            color: #344941;
            font-size: 16px;
            font-weight: bold;
        }

        .family-body {
            padding: 25px;
        }

        .info-row {
            margin-bottom: 18px;
            font-size: 17px;
        }

        .info-title {
            font-weight: bold;
            color: #344941;
            margin-left: 8px;
        }

        /* لینک افراد */
        .person-link {
            color: #0874d1;
            text-decoration: none;
            font-weight: bold;
        }

        .person-link:hover {
            text-decoration: underline;
        }

        .children-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 22px;
            margin-top: 12px;
        }

        .children-list a {
            color: #0874d1;
            text-decoration: none;
            font-weight: bold;
        }

        .children-list a:hover {
            text-decoration: underline;
        }

        .child-item:not(:last-child)::after {
            content: "|";
            color: #a8b5af;
            margin-right: 20px;
        }

        /* دکمه جزئیات */
        .details-button {
            display: inline-block;
            margin-top: 10px;

            padding: 9px 18px;

            border: 1.5px solid #08734a;
            border-radius: 9px;

            color: #075b3b;
            background: white;

            text-decoration: none;
            font-weight: bold;
        }

        .details-button:hover {
            background: #e9f7f0;
        }

        /* خط چین بین خانواده ها */
        .family-divider {
            border: none;
            border-top: 2px dashed #a9c5b8;
            margin: 25px -5px;
        }

        /* وقتی اطلاعاتی وجود ندارد */
        .empty {
            color: #777;
            font-weight: normal;
        }

        /* پیام خطا */
        .error-box {
            background: #fff1f1;
            color: #a32121;
            border: 1px solid #e4b5b5;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 17px;
        }

        /* بازگشت */
        .back-area {
            text-align: center;
            margin-top: 40px;
        }

        .back-button {
            display: inline-block;
            border: 1.5px solid #08734a;
            color: #075b3b;
            background: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 9px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #e9f7f0;
        }

        /* فوتر */
        footer {
            background: #075b3b;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        /* موبایل */
        @media (max-width: 700px) {

            header {
                min-height: 190px;
                padding: 40px 15px;
            }

            header h1 {
                font-size: 28px;
            }

            header p {
                font-size: 16px;
            }

            nav {
                flex-wrap: wrap;
            }

            nav a {
                padding: 13px 15px;
                font-size: 14px;
            }

            main {
                padding: 30px 12px 45px;
            }

            .page-title h2 {
                font-size: 28px;
            }

            .page-title p {
                font-size: 15px;
            }

            .family-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .family-name {
                font-size: 21px;
            }

            .family-body {
                padding: 20px 16px;
            }

            .children-list {
                display: block;
            }

            .child-item {
                display: inline-block;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌳 شجره‌نامه قباکلکی</h1>
    <p>درخت خانوادگی مردم قباکلکی</p>
</header>

<nav>
    <a href="./index.html">🏠 صفحه اصلی</a>
    <a href="./index.html">👨‍👩‍👧 خاندان‌ها</a>
    <a href="./person.html">👤 افراد</a>
</nav>

<main>

    <div class="page-title">
        <h2 id="familyTitle">خاندان</h2>
        <p id="familyDescription">اعضای خاندان و خانواده‌های وابسته به آن</p>
    </div>

    <div id="familyContainer"></div>

    <div class="back-area">
        <a class="back-button" href="./index.html">
            ← بازگشت به صفحه خاندان‌ها
        </a>
    </div>

</main>

<footer>
    شجره‌نامه قباکلکی © ۱۴۰۵
</footer>


<script>

    /*
     * گرفتن شناسه خاندان از آدرس
     *
     * مثال:
     * family.html?family=ahmad
     * family.html?family=ali
     * family.html?family=mohammad-abdolrashid
     */

    const params = new URLSearchParams(window.location.search);
    const familyId = params.get("family");


    /*
     * تعریف خاندان‌ها
     */

    const familyDefinitions = {

        ahmad: {
            title: "خاندان احمد",
            description: "اعضای خاندان احمد و خانواده‌های وابسته به آن",
            main: "ahmad"
        },

        ali: {
            title: "خاندان علی",
            description: "اعضای خاندان علی و خانواده‌های وابسته به آن",
            main: "ali"
        },

        "mohammad-abdolrashid": {
            title: "خاندان محمد عبدالرشید",
            description: "اعضای خاندان محمد عبدالرشید و خانواده‌های وابسته به آن",
            main: "mohammad-abdolrashid"
        }

    };


    /*
     * توابع کمکی
     */

    function getPerson(id) {
        if (!id || !people) return null;
        return people[id] || null;
    }


    function getName(id) {
        const person = getPerson(id);

        if (!person) {
            return "نام ثبت نشده";
        }

        return person.name || "نام ثبت نشده";
    }


    function createPersonLink(id) {

        const person = getPerson(id);

        if (!person) {
            return `<span class="empty">ثبت نشده</span>`;
        }

        return `
            <a
                class="person-link"
                href="./person.html?id=${encodeURIComponent(id)}"
            >
                ${person.name}
            </a>
        `;
    }


    function getSpouseId(person) {

        if (!person || !person.spouse) {
            return null;
        }

        if (Array.isArray(person.spouse)) {
            return person.spouse[0] || null;
        }

        return person.spouse;
    }


    function getChildrenIds(person) {

        if (!person || !person.children) {
            return [];
        }

        if (Array.isArray(person.children)) {
            return person.children;
        }

        return [];
    }


    /*
     * ساخت کارت یک خانواده
     */

    function createFamilyCard(personId) {

        const person = getPerson(personId);

        if (!person) {
            return "";
        }

        const spouseId = getSpouseId(person);
        const childrenIds = getChildrenIds(person);

        let childrenHTML = "";

        if (childrenIds.length > 0) {

            childrenHTML = childrenIds
                .filter(id => getPerson(id))
                .map(id => `
                    <span class="child-item">
                        ${createPersonLink(id)}
                    </span>
                `)
                .join("");

        } else {

            childrenHTML = `
                <span class="empty">
                    فرزندی ثبت نشده است
                </span>
            `;
        }


        return `
            <section class="family-card">

                <div class="family-header">

                    <div class="family-name">
                        <span class="person-icon">
                            ${person.gender === "female" ? "👩" : "👨"}
                        </span>

                        ${createPersonLink(personId)}
                    </div>

                    <div class="father-label">
                        پدر خانواده:
                        ${createPersonLink(personId)}
                    </div>

                </div>


                <div class="family-body">

                    <div class="info-row">

                        <span class="info-title">
                            همسر:
                        </span>

                        ${
                            spouseId
                            ? createPersonLink(spouseId)
                            : `<span class="empty">همسر ثبت نشده است</span>`
                        }

                    </div>


                    <div class="info-row">

                        <span class="info-title">
                            👨‍👩‍👧‍👦 فرزندان:
                        </span>

                        <div class="children-list">
                            ${childrenHTML}
                        </div>

                    </div>


                    <a
                        class="details-button"
                        href="./person.html?id=${encodeURIComponent(personId)}"
                    >
                        ← مشاهده جزئیات
                    </a>

                </div>

            </section>
        `;
    }


    /*
     * ساخت لیست خانواده‌ها
     */

    function renderFamily() {

        const container = document.getElementById("familyContainer");

        const definition = familyDefinitions[familyId];


        /*
         * اگر خاندان پیدا نشد
         */

        if (!definition) {

            document.getElementById("familyTitle").textContent =
                "خاندان پیدا نشد";

            document.getElementById("familyDescription").textContent =
                "لطفاً از صفحه اصلی یکی از خاندان‌ها را انتخاب کنید.";

            container.innerHTML = `
                <div class="error-box">
                    اطلاعات این خاندان پیدا نشد.
                    <br><br>
                    لطفاً به صفحه اصلی برگردید و دوباره انتخاب کنید.
                </div>
            `;

            return;
        }


        /*
         * تغییر عنوان صفحه
         */

        document.getElementById("familyTitle").textContent =
            definition.title;

        document.getElementById("familyDescription").textContent =
            definition.description;


        /*
         * پیدا کردن فرد اصلی خاندان
         */

        const mainPerson = getPerson(definition.main);

        if (!mainPerson) {

            container.innerHTML = `
                <div class="error-box">
                    اطلاعات خاندان در people.js پیدا نشد.
                    <br><br>
                    شناسه مورد نظر:
                    ${definition.main}
                </div>
            `;

            return;
        }


        /*
         * خانواده اصلی
         */

        let familyMembers = [definition.main];

        /*
         * فرزندان خانواده اصلی را به عنوان
         * خانواده‌های بعدی نمایش می‌دهیم.
         */

        const children = getChildrenIds(mainPerson);

        children.forEach(childId => {

            if (
                getPerson(childId) &&
                !familyMembers.includes(childId)
            ) {
                familyMembers.push(childId);
            }

        });


        /*
         * ساخت HTML
         */

        let html = "";

        familyMembers.forEach((personId, index) => {

            html += createFamilyCard(personId);

            /*
             * خط چین بین خانواده‌ها
             */

            if (index < familyMembers.length - 1) {

                html += `
                    <hr class="family-divider">
                `;

            }

        });


        container.innerHTML = html;
    }


    /*
     * اجرای صفحه
     */

    renderFamily();

</script>

</body>
</html>
