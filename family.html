                ),

            background-position: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
        }

        /* ================= TOP ================= */

        .top-bar {
            max-width: 1200px;
            margin: auto;

            padding: 15px 20px;

            display: flex;
            justify-content: flex-start;
        }

        .back-button {
            text-decoration: none;

            color: #17633d;
            background: white;

            border: 1px solid #cbded2;

            padding: 9px 18px;

            border-radius: 10px;

            transition: 0.2s;
        }

        .back-button:hover {
            background: #17633d;
            color: white;
        }

        /* ================= TITLE ================= */

        .family-title {
            text-align: center;

            padding: 15px 20px 25px;
        }

        .family-title h2 {
            font-size: 28px;
            color: #17633d;

            margin-bottom: 5px;
        }

        .family-title p {
            color: #718078;
            font-size: 14px;
        }

        /* ================= TREE ================= */

        .tree-area {
            width: 100%;

            overflow-x: auto;

            padding: 20px 30px 80px;
        }

        .tree {
            width: max-content;

            min-width: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
        }

        /* ================= PERSON ================= */

        .person {
            width: 150px;

            background: white;

            border: 2px solid #a9cbb7;

            border-radius: 16px;

            padding: 12px;

            text-align: center;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0, 70, 40, 0.10);

            transition: all 0.25s;

            position: relative;
        }

        .person:hover {
            transform: translateY(-5px);

            border-color: #176b43;

            box-shadow: 0 10px 25px rgba(0, 70, 40, 0.18);
        }

        .person-photo {
            width: 58px;
            height: 58px;

            margin: auto;
            margin-bottom: 8px;

            border-radius: 50%;

            background: #e4f0e8;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 30px;

            overflow: hidden;
        }

        .person-photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .person-name {
            font-size: 16px;

            font-weight: bold;

            color: #155f3b;
        }

        .person-job {
            font-size: 11px;

            color: #7b8981;

            margin-top: 3px;
        }

        /* ================= COUPLE ================= */

        .couple {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .heart {
            font-size: 22px;

            color: #b27d28;
        }

        /* ================= CONNECTOR ================= */

        .vertical-line {
            width: 2px;
            height: 40px;

            background: #8eb5a0;
        }

        /* ================= CHILDREN ================= */

        .children {
            display: flex;

            align-items: flex-start;
            justify-content: center;

            gap: 30px;

            position: relative;

            padding-top: 35px;
        }

        .children::before {
            content: "";

            position: absolute;

            top: 17px;

            left: 60px;
            right: 60px;

            height: 2px;

            background: #8eb5a0;
        }

        .child {
            position: relative;

            padding-top: 20px;
        }

        .child::before {
            content: "";

            position: absolute;

            width: 2px;
            height: 20px;

            background: #8eb5a0;

            top: 0;
            left: 50%;
        }

        /* ================= MODAL ================= */

        .modal {
            position: fixed;

            inset: 0;

            background: rgba(0, 40, 25, 0.65);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .profile {
            background: white;

            width: 100%;
            max-width: 430px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 22px;

            padding: 25px;

            position: relative;

            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .close {
            position: absolute;

            left: 15px;
            top: 12px;

            width: 35px;
            height: 35px;

            border: none;

            border-radius: 50%;

            background: #edf4ef;

            color: #17633d;

            font-size: 22px;

            cursor: pointer;
        }

        .profile-photo {
            width: 120px;
            height: 120px;

            margin: 5px auto 15px;

            border-radius: 50%;

            background: #e5f1e9;

            border: 4px solid #d2e5da;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 55px;

            overflow: hidden;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .profile h2 {
            text-align: center;

            color: #155f3b;

            font-size: 25px;

            margin-bottom: 20px;
        }

        .info {
            border-top: 1px solid #e0ebe4;
        }

        .info-row {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 11px 0;

            border-bottom: 1px dashed #d4e1d9;

            font-size: 14px;
        }

        .label {
            color: #718078;
        }

        .value {
            color: #183b2a;

            font-weight: bold;

            text-align: left;

            background: #e5f0e9;

            padding: 25px;

                width: 135px;

            .children {
                gap: 18px;
            }

        }

/* =====================================================
   ساخت کارت شخص
===================================================== */

function personCard(id) {

    const person = people[id];

    if (!person) {
        return "";
    }

    let photo = "👤";

    if (person.photo) {

        photo = `
            <img
                src="${person.photo}"
                alt="${person.name}"
            >
        `;

    }

    return `
        <div
            class="person"
            onclick="showProfile('${id}')"
        >

            <div class="person-photo">
                ${photo}
            </div>

            <div class="person-name">
                ${person.name}
            </div>

            <div class="person-job">
                ${person.job || "برای مشاهده مشخصات کلیک کنید"}
            </div>

        </div>
    `;
}


/* =====================================================
   ساخت زوج
===================================================== */

function couple(personId, spouseId) {

    let html = `
        <div class="couple">
            ${personCard(personId)}
    `;

    if (spouseId) {

        html += `
            <div class="heart">
                ♥
            </div>

            ${personCard(spouseId)}
        `;
    }

    html += `
        </div>
    `;

    return html;
}


/* =====================================================
   ساخت درخت به صورت بازگشتی
===================================================== */

function familyTree(personId, spouseId, children) {

    let html = `

        <div class="family-node">

            ${couple(personId, spouseId)}

    `;


    if (children && children.length > 0) {

        html += `

            <div class="vertical-line"></div>

            <div class="children">

        `;


        children.forEach(child => {

            html += `

                <div class="child">

                    ${familyTree(
                        child.id,
                        child.spouse,
                        child.children
                    )}

                </div>

            `;

        });


        html += `
            </div>
        `;
    }


    html += `
        </div>
    `;


    return html;
}

/* =====================================================
   تشخیص خاندان از لینک
===================================================== */

const urlParams =
    new URLSearchParams(window.location.search);

const familyId =
    urlParams.get("family") || "ahmad";


/* =====================================================
   نمایش نمودار
===================================================== */

function renderTree() {

    const family =
        families[familyId];

    const title =
        document.getElementById("familyTitle");

    const tree =
        document.getElementById("tree");


    if (!family) {

        title.textContent =
            "خاندان پیدا نشد";

        tree.innerHTML = `

            <div
                style="
                    background:white;
                    padding:30px;
                    border-radius:15px;
                    color:#17633d;
                "
            >
                این خاندان پیدا نشد.
            </div>

        `;

        return;
    }


    title.textContent =
        family.title;


    tree.innerHTML = familyTree(
        family.root.person,
        family.root.spouse,
        family.root.children
    );

}


renderTree();


/* =====================================================
   نمایش مشخصات
===================================================== */

function showProfile(id) {

    const person =
        people[id];

    if (!person) {
        return;
    }


    document.getElementById(
        "profileName"
    ).textContent =
        person.name;


    /* عکس */

    const photo =
        document.getElementById("profilePhoto");


    if (person.photo) {

        photo.innerHTML = `
            <img
                src="${person.photo}"
                alt="${person.name}"
            >
        `;

    } else {

        photo.innerHTML = "👤";

    }


    /* اطلاعات */

    let html = "";


    if (person.job) {

        html += `
            <div class="info-row">
                <span class="label">شغل</span>
                <span class="value">${person.job}</span>
            </div>
        `;

    }


    if (person.education) {

        html += `
            <div class="info-row">
                <span class="label">تحصیلات</span>
                <span class="value">${person.education}</span>
            </div>
        `;

    }


    if (person.father) {

        html += `
            <div class="info-row">
                <span class="label">پدر</span>
                <span class="value">${person.father}</span>
            </div>
        `;

    }


    if (person.mother) {

        html += `
            <div class="info-row">
                <span class="label">مادر</span>
                <span class="value">${person.mother}</span>
            </div>
        `;

    }


    if (person.spouse) {

        html += `
            <div class="info-row">
                <span class="label">همسر</span>
                <span class="value">${person.spouse}</span>
            </div>
        `;

    }


    if (person.children) {

        html += `
            <div class="info-row">
                <span class="label">فرزندان</span>
                <span class="value">${person.children}</span>
            </div>
        `;

    }


    if (!html) {

        html = `
            <div
                style="
                    text-align:center;
                    padding:20px;
                    color:#718078;
                "
            >
                هنوز اطلاعاتی برای این شخص ثبت نشده است.
            </div>
        `;

    }


    document.getElementById(
        "profileInfo"
    ).innerHTML = html;


    document.getElementById(
        "modal"
    ).classList.add("show");

}


/* =====================================================
   بستن مشخصات
===================================================== */

function closeProfile() {

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =====================================================
   بستن با کلیک بیرون
===================================================== */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {
                closeProfile();
            }

        }
    );


/* =====================================================
   بستن با کلید ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {
            closeProfile();
        }

    }
);

</script>
