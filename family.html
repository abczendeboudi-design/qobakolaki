<head>

        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>شجره‌نامه قباکلکی</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f8f5;
            color: #183b2a;
            line-height: 1.8;
        }


        /* =========================
           سربرگ
        ========================= */

        header {
            background:
                linear-gradient(
                    rgba(0, 70, 40, 0.78),
                    rgba(0, 55, 32, 0.85)
                ),
                url("./IMG-20260828-WA0000.jpg");

            background-size: cover;
            background-position: center;

            color: white;

            padding: 35px 20px;

            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }


        /* =========================
           نوار بالا
        ========================= */

        .top-bar {
            max-width: 1200px;
            margin: 0 auto;

            padding: 15px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .back-button {
            display: inline-block;

            background: white;
            color: #17633d;

            border: 1px solid #cfe0d6;

            padding: 8px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 14px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .back-button:hover {
            background: #17633d;
            color: white;
        }


        /* =========================
           عنوان خاندان
        ========================= */

        .family-title {
            text-align: center;

            padding: 20px 15px 10px;
        }

        .family-title h2 {
            color: #17633d;
            font-size: 28px;

            margin-bottom: 5px;
        }

        .family-title p {
            color: #687a70;
            font-size: 14px;
        }


        /* =========================
           ناحیه نمودار
        ========================= */

        .tree-wrapper {
            width: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            padding: 30px 25px 70px;

            -webkit-overflow-scrolling: touch;
        }

        .tree {
            min-width: 850px;

            display: flex;
            flex-direction: column;
            align-items: center;

            margin: 0 auto;
        }


        /* =========================
           نسل
        ========================= */

        .generation {
            display: flex;

            justify-content: center;
            align-items: flex-start;

            gap: 35px;

            width: max-content;

            position: relative;
        }


        /* =========================
           واحد خانواده
        ========================= */

        .family-unit {
            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;

            min-width: 170px;
        }


        /* زوج */

        .couple {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            position: relative;
        }


        /* =========================
           کارت شخص
        ========================= */

        .person-card {
            width: 145px;

            background: white;

            border: 2px solid #b9d3c3;

            border-radius: 14px;

            padding: 13px 10px;

            text-align: center;

            cursor: pointer;

            box-shadow:
                0 5px 16px rgba(0, 70, 40, 0.09);

            transition: 0.25s;

            position: relative;
        }

        .person-card:hover {
            transform: translateY(-4px);

            border-color: #176b43;

            box-shadow:
                0 9px 24px rgba(0, 70, 40, 0.16);
        }


        /* آیکون شخص */

        .person-icon {
            width: 48px;
            height: 48px;

            margin: 0 auto 7px;

            border-radius: 50%;

            background: #e3f0e8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
        }


        .person-name {
            font-size: 16px;

            font-weight: bold;

            color: #155f3b;

            margin-bottom: 3px;
        }

        .person-role {
            font-size: 11px;

            color: #74847b;
        }


        /* =========================
           علامت ازدواج
        ========================= */

        .marriage {
            font-size: 18px;

            color: #b18428;

            font-weight: bold;
        }


        /* =========================
           خط بین نسل‌ها
        ========================= */

        .generation-line {
            width: 2px;

            height: 45px;

            background: #8db39d;

            position: relative;
        }


        .generation-line::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 50%;

            width: 9px;
            height: 9px;

            border-left: 2px solid #8db39d;
            border-bottom: 2px solid #8db39d;

            transform:
                translateX(-50%)
                rotate(-45deg);
        }


        /* =========================
           فرزندان
        ========================= */

        .children {
            display: flex;

            justify-content: center;
            align-items: flex-start;

            gap: 28px;

            position: relative;

            padding-top: 35px;
        }


        /*
           خط افقی بالای فرزندان
        */

        .children::before {
            content: "";

            position: absolute;

            top: 17px;

            left: 10%;

            right: 10%;

            height: 2px;

            background: #8db39d;
        }


        /* خط عمودی هر فرزند */

        .child {
            position: relative;

            padding-top: 18px;
        }

        .child::before {
            content: "";

            position: absolute;

            top: 0;
            left: 50%;

            width: 2px;
            height: 20px;

            background: #8db39d;
        }


        /* =========================
           عنوان نسل
        ========================= */

        .generation-title {
            color: #5c7869;

            font-size: 13px;

            background: #e6f0ea;

            padding: 5px 15px;

            border-radius: 20px;

            margin-bottom: 18px;
        }


        /* =========================
           مشخصات شخص - پنجره
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 35, 20, 0.62);

            z-index: 1000;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal.active {
            display: flex;
        }


        .profile {
            background: white;

            width: 100%;
            max-width: 430px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 20px;

            padding: 25px;

            position: relative;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);

            animation: showProfile 0.2s ease;
        }


        @keyframes showProfile {

            from {
                opacity: 0;
                transform: translateY(15px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        .close {
            position: absolute;

            top: 12px;
            left: 15px;

            width: 34px;
            height: 34px;

            border: none;

            border-radius: 50%;

            background: #edf4ef;

            color: #17633d;

            font-size: 20px;

            cursor: pointer;
        }


        /* =========================
           عکس شخص
        ========================= */

        .profile-photo {
            width: 115px;
            height: 115px;

            margin: 5px auto 15px;

            border-radius: 50%;

            overflow: hidden;

            border: 4px solid #d7e9de;

            background: #e8f2ec;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 50px;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        .profile h2 {
            text-align: center;

            color: #155f3b;

            font-size: 24px;

            margin-bottom: 20px;
        }


        /* =========================
           اطلاعات
        ========================= */

        .info-row {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 10px 0;

            border-bottom: 1px dashed #d5e2da;

            font-size: 14px;
        }

        .info-label {
            color: #718078;

            min-width: 80px;
        }

        .info-value {
            color: #183b2a;

            font-weight: bold;

            text-align: left;
        }


        /* =========================
           پایین صفحه
        ========================= */

        footer {
            text-align: center;

            padding: 25px 15px;

            background: #e5f0e9;

            color: #60756a;

            font-size: 13px;
        }


        /* =========================
           موبایل
        ========================= */

            header {
                padding: 27px 15px;

                font-size: 25px;
            }

                padding: 12px;
            }

            .family-title h2 {

            }

                padding-left: 10px;
                padding-right: 10px;
            }

            .person-card {
                width: 135px;
            }

            .children {
                gap: 20px;
            }

        }

/* ==================================================
   ساخت کارت شخص
================================================== */

function createPerson(id) {

    const person = people[id];

    if (!person) {
        return "";
    }

    const role =
        person.job ||
        "برای مشاهده مشخصات کلیک کنید";


    return `

        <div
            class="person-card"
            onclick="showProfile('${id}')"
        >

            <div class="person-icon">
                👤
            </div>

            <div class="person-name">
                ${person.name}
            </div>

            <div class="person-role">
                ${role}
            </div>

        </div>

    `;
}


/* ==================================================
   ساخت یک زوج
================================================== */

function createCouple(personId, spouseId) {

    let html = `
        <div class="couple">
    `;

    html += createPerson(personId);

    if (spouseId) {

        html += `
            <div class="marriage">
                ♥
            </div>
        `;

        html += createPerson(spouseId);

    }

    html += `
        </div>
    `;

    return html;
}


/* ==================================================
   ساخت خانواده
================================================== */

function createFamilyUnit(
    personId,
    spouseId,
    children
) {

    let html = `
        <div class="family-unit">

            ${createCouple(personId, spouseId)}
    `;


    if (children && children.length > 0) {

        html += `
            <div class="generation-line"></div>

            <div class="children">
        `;


        children.forEach(child => {

            html += `
                <div class="child">

                    ${createFamilyUnit(
                        child.id,
                        child.spouse,
                        child.children
                    )}

                </div>
            `;

        });


        html += `
            </div>
        `;

    }


    html += `
        </div>
    `;

    return html;
}

/* ==================================================
   انتخاب خاندان از آدرس صفحه
================================================== */

const params =
    new URLSearchParams(window.location.search);

const familyId =
    params.get("family") || "ahmad";


/* ==================================================
   نمایش خاندان
================================================== */

function renderFamily() {

    const family =
        families[familyId];

    const title =
        document.getElementById("familyTitle");

    const tree =
        document.getElementById("tree");


    if (!family) {

        title.textContent =
            "خاندان پیدا نشد";

        tree.innerHTML = `

            <div style="
                background:white;
                padding:30px;
                border-radius:15px;
                text-align:center;
            ">

                این خاندان در شجره‌نامه وجود ندارد.

            </div>

        `;

        return;
    }


    title.textContent =
        family.title;


    tree.innerHTML = `

        <div class="generation-title">
            نسل اصلی
        </div>

        ${createFamilyUnit(
            family.root.person,
            family.root.spouse,
            family.root.children
        )}

    `;

}


renderFamily();


/* ==================================================
   نمایش مشخصات شخص
================================================== */

function showProfile(id) {

    const person =
        people[id];

    if (!person) {
        return;
    }


    document.getElementById(
        "profileName"
    ).textContent = person.name;


    /* عکس */

    const photo =
        document.getElementById("profilePhoto");


    if (person.photo) {

        photo.innerHTML = `
            <img
                src="${person.photo}"
                alt="${person.name}"
                onerror="
                    this.parentElement.innerHTML='👤';
                "
            >
        `;

    } else {

        photo.innerHTML = "👤";

    }


    /* اطلاعات */

    let info = "";


    if (person.job) {

        info += `

            <div class="info-row">

                <span class="info-label">
                    شغل
                </span>

                <span class="info-value">
                    ${person.job}
                </span>

            </div>

        `;

    }


    if (person.education) {

        info += `

            <div class="info-row">

                <span class="info-label">
                    تحصیلات
                </span>

                <span class="info-value">
                    ${person.education}
                </span>

            </div>

        `;

    }


    if (person.father) {

        info += `

            <div class="info-row">

                <span class="info-label">
                    پدر
                </span>

                <span class="info-value">
                    ${person.father}
                </span>

            </div>

        `;

    }


    if (person.mother) {

        info += `

            <div class="info-row">

                <span class="info-label">
                    مادر
                </span>

                <span class="info-value">
                    ${person.mother}
                </span>

            </div>

        `;

    }
