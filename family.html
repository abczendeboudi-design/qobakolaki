<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شجره‌نامه خاندان</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f1e8;
      color: #26332b;
      line-height: 1.8;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page-header {
      background: #315b45;
      color: white;
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .page-header h1 {
      margin: 0;
      font-size: 25px;
    }

    .page-header p {
      margin: 6px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .container {
      width: min(1500px, 96%);
      margin: 24px auto;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    button,
    .action-link {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: #315b45;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    button:hover,
    .action-link:hover {
      background: #254936;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }

    .stat-number {
      display: block;
      color: #315b45;
      font-size: 25px;
      font-weight: bold;
    }

    .stat-title {
      font-size: 13px;
      color: #68736c;
    }

    .tree-wrapper {
      background: #fffdf8;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      overflow-x: auto;
    }

    .tree {
      min-width: 900px;
      text-align: center;
    }

    .person-card {
      display: inline-block;
      min-width: 155px;
      max-width: 230px;
      padding: 12px 15px;
      margin: 6px;
      background: white;
      border: 1px solid #d9e2db;
      border-radius: 13px;
      box-shadow: 0 2px 7px rgba(0,0,0,.07);
      cursor: pointer;
      transition: .2s;
      vertical-align: top;
    }

    .person-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(0,0,0,.12);
      border-color: #315b45;
    }

    .person-name {
      font-weight: bold;
      color: #284b39;
      font-size: 15px;
    }

    .person-meta {
      font-size: 11px;
      color: #78837c;
      margin-top: 3px;
    }

    .root-card {
      background: #315b45;
      color: white;
      border-color: #315b45;
      min-width: 210px;
    }

    .root-card .person-name,
    .root-card .person-meta {
      color: white;
    }

    .generation-label {
      margin: 22px 0 8px;
      color: #315b45;
      font-weight: bold;
      font-size: 14px;
    }

    .union {
      display: inline-block;
      vertical-align: top;
      margin: 8px;
      min-width: 190px;
      max-width: 100%;
    }

    .union-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 3px;
    }

    .spouse-line {
      color: #9a6b38;
      font-size: 18px;
      font-weight: bold;
      vertical-align: top;
      margin-top: 18px;
    }

    .children-area {
      margin-top: 10px;
      padding-top: 12px;
      border-top: 2px solid #d7dfd8;
      position: relative;
    }

    .children {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 7px;
    }

    .child-branch {
      display: inline-block;
      vertical-align: top;
      text-align: center;
    }

    .child-branch::before {
      content: "";
      display: block;
      width: 2px;
      height: 10px;
      background: #b9c8bd;
      margin: -12px auto 0;
    }

    .grandchild-card {
      min-width: 145px;
      background: #fdfbf5;
    }

    .family-link {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #315b45;
      font-weight: bold;
    }

    .shared-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 7px;
      border-radius: 20px;
      background: #e7efe9;
      color: #315b45;
      font-size: 10px;
    }

    .empty-message {
      padding: 35px;
      text-align: center;
      color: #777;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .modal-box {
      width: min(600px, 100%);
      background: #fffdf8;
      border-radius: 18px;
      margin-top: 30px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .modal-header {
      background: #315b45;
      color: white;
      padding: 20px;
      position: relative;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .close-modal {
      position: absolute;
      left: 14px;
      top: 12px;
      background: transparent;
      font-size: 24px;
      padding: 2px 8px;
    }

    .profile-content {
      padding: 20px;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #e7ece8;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #718078;
      overflow: hidden;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-row {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #e6e4dc;
      padding: 9px 0;
    }

    .profile-label {
      width: 100px;
      min-width: 100px;
      color: #68736c;
      font-weight: bold;
    }

    .profile-value {
      flex: 1;
    }

    .profile-section {
      margin-top: 18px;
    }

    .profile-section h3 {
      color: #315b45;
      font-size: 16px;
      margin: 0 0 8px;
    }

    .person-chip {
      display: inline-block;
      background: #eef3ef;
      color: #315b45;
      border-radius: 9px;
      padding: 6px 10px;
      margin: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    .person-chip:hover {
      background: #dfe9e2;
    }

    .profile-family-button {
      margin-top: 18px;
      display: inline-block;
      background: #315b45;
      color: white;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .tree-wrapper {
        padding: 12px;
      }

      .page-header h1 {
        font-size: 20px;
      }
    }

    /* Print */
    @media print {
      body {
        background: white;
      }

      .page-header {
        background: white;
        color: black;
        box-shadow: none;
        border-bottom: 1px solid #ccc;
      }

      .top-actions,
      .stats,
      .modal,
      button,
      .family-link {
        display: none !important;
      }

      .container {
        width: 100%;
        margin: 0;
      }

      .tree-wrapper {
        box-shadow: none;
        padding: 0;
        overflow: visible;
      }

      .tree {
        min-width: 0;
      }

      .person-card {
        box-shadow: none;
      }
    }
  </style>
</head>

</header>

    </div>
  </div>

  <section class="tree-wrapper">
    <div id="tree" class="tree">
      <div class="empty-message">
        در حال بارگذاری شجره‌نامه...
      </div>
    </div>
  </section>

</main>

<!-- Profile Modal -->
<div id="profileModal" class="modal">

    </div>

  </div>
</div>
