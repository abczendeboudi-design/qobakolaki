<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شجره‌نامه قباکلکی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f1e8;
      color: #24352a;
    }

    header {
      background: #315b42;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
      font-size: 15px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .family-list {
      display: grid;
      gap: 18px;
    }

    .family-link {
      display: block;
      text-decoration: none;
      color: #24352a;
      background: white;
      border: 1px solid #d8d0c1;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .family-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    }

    .family-number {
      display: inline-block;
      background: #315b42;
      color: white;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      line-height: 34px;
      text-align: center;
      margin-left: 10px;
    }

    .family-name {
      font-size: 19px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 40px 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>شجره‌نامه خاندان‌های قباکلکی</h1>
  <p>سامانه ثبت و نمایش شجره‌نامه‌های روستای قباکلکی</p>
</header>

<main>
  <div id="familyList" class="family-list"></div>
</main>

<footer>
  شجره‌نامه قباکلکی
</footer>

<script src="data/families.js"></script>

<script>
  const familyList = document.getElementById("familyList");

  const families =
    window.GENEALOGY_DATA &&
    Array.isArray(window.GENEALOGY_DATA.families)
      ? window.GENEALOGY_DATA.families
      : [];

  if (families.length === 0) {
    familyList.innerHTML = `
      <div style="background:white;padding:25px;border-radius:15px;text-align:center;">
        هنوز شجره‌نامه‌ای ثبت نشده است.
      </div>
    `;
  } else {
    families.forEach(family => {

      const link = document.createElement("a");

      link.className = "family-link";

      link.href =
        "genealogy.html?family=" +
        encodeURIComponent(family.id);

      link.innerHTML = `
        <span class="family-number">${family.number}</span>
        <span class="family-name">${family.name}</span>
      `;

      familyList.appendChild(link);
    });
  }
</script>

</body>
</html>
