<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شجره‌نامه قباکلکی</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f8f5;
            color: #183c2a;
        }

        header {
            background:
                linear-gradient(
                    rgba(0, 75, 40, 0.72),
                    rgba(0, 55, 30, 0.80)
                ),
                url("./IMG-20260828-WA0000.jpg");

            background-size: cover;
            background-position: center;

            min-height: 280px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            color: white;

            padding: 30px 15px;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        .container {
            width: min(1100px, 94%);
            margin: 35px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            margin: 0 0 10px;
            color: #12613b;
            font-size: 27px;
        }

        .title p {
            color: #65776c;
            margin: 0;
        }

        .family-card {
            max-width: 650px;
            margin: 0 auto;

            background: white;
            border-radius: 22px;

            padding: 28px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.08);

            text-align: center;

            border: 1px solid #dce9e0;
        }

        .family-number {
            display: inline-flex;

            width: 55px;
            height: 55px;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #177245;
            color: white;

            font-size: 25px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        .family-card h3 {
            margin: 5px 0 10px;
            color: #174d31;
            font-size: 24px;
        }

        .family-card p {
            color: #68776e;
            line-height: 1.9;
        }

        .main-link {
            display: inline-block;

            margin-top: 15px;

            padding: 13px 28px;

            border-radius: 12px;

            background: #12613b;
            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }

        .main-link:hover {
            background: #0c482c;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 60px;

            padding: 25px;

            text-align: center;

            background: #103d28;

            color: white;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            header {
                min-height: 230px;
            }

            header h1 {
                font-size: 25px;
            }

            header p {
                font-size: 15px;
            }

            .family-card {
                padding: 22px 16px;
            }

            .title h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header>

    <div>

        <h1>شجره‌نامه قباکلکی</h1>

        <p>
            خاندان‌ها و نسل‌های مردم قباکلکی
        </p>

    </div>

</header>


<main class="container">

    <div class="title">

        <h2>خاندان‌ها</h2>

        <p>
            برای مشاهده شجره‌نامه، خاندان موردنظر را انتخاب کنید.
        </p>

    </div>


    <!-- خاندان اول -->

    <div class="family-card">

        <div class="family-number">
            ۱
        </div>

        <h3>
            خاندان غلامحسین قاسم زائر غلامحسین
        </h3>

        <p>
            مشاهده شجره‌نامه و اطلاعات اعضای خاندان
        </p>

        <a
            href="genealogy.html?family=gholamhossein-qasem"
            class="main-link"
        >
            مشاهده شجره‌نامه
        </a>

    </div>

</main>


<footer>

    شجره‌نامه مردم قباکلکی

</footer>

</body>
</html>
